# ★ 2026-08-10:速度全部壓到最低,第一次實車驗證用。
#   確認路線與轉向正確之後再往上調 —— 調的順序是
#   desired_linear_vel -> velocity_smoother 的 max_velocity/max_accel,
#   兩邊要一起改,只改一邊會被另一邊夾住而看不出效果。
#
# Nav2 控制層 —— 在原本「只規劃」的基礎上補上「會動」的部分。
#
# 原本只有 planner_server + global_costmap:點一個目標,畫一條線,人推著走。
# 這份加上 controller_server / bt_navigator / behavior_server / velocity_smoother,
# 讓 Nav2 真的能輸出速度指令。
#
# ── 車輛事實(這些不是猜的,量自 chassis_description)──
#   輪距 0.6221 m   輪半徑 0.2032 m(16 吋)
#   車體 1.0097 × 0.7435 m(含輪)   外接圓 0.627 m   內接圓 0.390 m
#   差動輪 -> 可以原地旋轉,最小迴轉半徑 0
#   整車含電池目測 60 kg 以上 -> 加速度要保守,慣性很大
#
# ── 座標系 ──
#   map → odom          slam_toolbox
#   odom → base_link    FAST-LIO(底盤自己發的 odom → base_footprint 是另一條分支,不碰)
#   base_link → 感測器   URDF

controller_server:
  ros__parameters:
    use_sim_time: false
    # /scan 是 10 Hz,控制迴路比感測快沒有意義,只是空轉燒 CPU
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.02
    min_theta_velocity_threshold: 0.05
    failure_tolerance: 0.5

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # 這台車很重,起步慢。門檻太嚴會在剛啟動時就判定「卡住」而中止
      required_movement_radius: 0.30
      movement_time_allowance: 15.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # 1 公尺長的車不可能停在 10 公分的精度上,而且展示時也不需要
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.35
      stateful: true

    # Regulated Pure Pursuit,不是 DWB。
    #   DWB 每個週期要對數百條軌跡取樣評分,在 Orin Nano 上跟 FAST-LIO 搶 CPU;
    #   而且它的行為對十幾個權重參數很敏感,調起來很痛苦。
    #   RPP 只有幾個有物理意義的參數,對「大車、低速、走廊」這個情境剛好。
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      desired_linear_vel: 0.12        # 最低速度驗證。人走路約 1.2 m/s,這是十分之一        # 展示速度。底盤本身能更快,但推車驗證階段不需要
      lookahead_dist: 0.60            # 約一個車長。太短會蛇行,太長會切彎切進牆裡
      min_lookahead_dist: 0.35
      max_lookahead_dist: 0.90
      lookahead_time: 2.0
      use_velocity_scaled_lookahead_dist: true

      # 靠近障礙自動減速。內接圓 0.390,所以 0.55 m 時開始收油門
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.90
      regulated_linear_scaling_min_speed: 0.06
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.55
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0

      # 差動輪先轉再走。1 公尺長的車不轉正就切彎,尾巴會掃到牆
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.70
      rotate_to_heading_angular_vel: 0.25   # 原地轉向。0.25 rad/s = 每圈 25 秒
      max_angular_accel: 0.4

      allow_reversing: false          # 沒有後方感測器,倒車是盲的
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5

      transform_tolerance: 0.20       # FAST-LIO 的 TF 會落後 1~2 秒,不能設太緊

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: multi_odom              # ★ 局部代價地圖要用 odom,不能用 map ——
                                      #   map 會因為迴路閉合而跳,控制迴路吃到跳變會抽搐
      robot_base_frame: base_footprint
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      transform_tolerance: 0.20

      # 跟 global_costmap 用同一組,不要兩邊不一致 —— 那會出現
      # 「全域說可以走,局部說撞到」而路徑不斷重規劃的鬼打牆
      footprint: "[[0.52, 0.39], [0.52, -0.39], [-0.52, -0.39], [-0.52, 0.39]]"
      footprint_padding: 0.02

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # Nav2 從 footprint 算出的內接圓是 0.410(半寬 0.39 + padding 0.02)。
        # inflation_radius 小於它的話,膨脹層根本畫不出「內接必撞」那一圈,
        # 啟動時會直接報 ERROR。0.55 = 0.41 + 14 cm 安全邊界。
        # 這台車真的有 1.04 x 0.78 m,窄走廊會很緊 —— 那是實情,不是設定太保守。
        inflation_radius: 0.55

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    # 直接用 FAST-LIO 的 /Odometry,不是底盤的 /odom ——
    # 底盤的輪速里程計在打滑時會騙人,而且它跟我們的 TF 分屬不同分支。
    # 這裡只拿來判斷「有沒有在動」,不參與定位。
    odom_topic: /Odometry
    # 自己的行為樹,拿掉 BackUp。預設那兩棵都會呼叫 backup action,而
    # behavior_server 只註冊了 spin / wait,載入時就會整個 configure 失敗。
    # 兩棵都要換 —— bt_navigator 在 configure 階段會把兩棵都載入驗證。
    default_nav_to_pose_bt_xml: /home/andykuo/nav2/bt_navigate_to_pose.xml
    default_nav_through_poses_bt_xml: /home/andykuo/nav2/bt_navigate_through_poses.xml
    bt_loop_duration: 10
    default_server_timeout: 20
    # 不要自己列 plugin_lib_names。
    # bt_navigator 的預設清單涵蓋所有預設行為樹用到的節點;
    # 手寫一份必然會漏(這裡先漏了 RemovePassedGoals,configure 直接失敗),
    # 而且錯誤訊息只說「Node not recognized」,看不出是清單不全還是 BT 檔壞了。

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # ★ 沒有 backup。這台車沒有後方感測器,盲倒車對 1 公尺長的車太危險。
    #   卡住時寧可原地轉一下重找路,或直接停下來讓人處理。
    behavior_plugins: ["spin", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    wait:
      plugin: "nav2_behaviors/Wait"
    local_frame: multi_odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.20
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.25
    min_rotational_vel: 0.08
    rotational_acc_lim: 0.4

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"            # 用不到底盤回報,純粹夾住指令的變化率
    # 60 公斤以上的車,加速度給大了會前後晃,乘客(和雷達)都不舒服
    max_velocity:   [0.12,  0.0,  0.30]
    min_velocity:   [-0.12, 0.0, -0.30]
    max_accel:      [0.10,  0.0,  0.40]
    max_decel:      [-0.40, 0.0, -0.80]   # 減速可以比加速猛,安全優先
    odom_topic: "/Odometry"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 2000
