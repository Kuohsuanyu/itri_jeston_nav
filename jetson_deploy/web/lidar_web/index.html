<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mid-360 · FAST-LIO 即時建圖</title>
<style>
  :root{
    --bg:#080b11; --panel:rgba(16,22,32,.84); --line:rgba(120,160,220,.18);
    --fg:#dbe6f5; --dim:#7d8da3; --ok:#39d98a; --bad:#ff5f6d; --accent:#4ea1ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:13px/1.5 ui-monospace,"Cascadia Mono",Consolas,monospace;overflow:hidden}
  canvas{display:block}

  .hud{position:fixed;z-index:10;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;backdrop-filter:blur(12px);padding:12px 14px}

  #stats{top:14px;left:14px;min-width:226px}
  #stats h1{margin:0 0 10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--accent);font-weight:600}
  .row{display:flex;justify-content:space-between;gap:16px;padding:2px 0}
  .row span:first-child{color:var(--dim)}
  .row span:last-child{font-variant-numeric:tabular-nums}
  .sep{height:1px;background:var(--line);margin:8px 0}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.off{background:var(--bad);box-shadow:0 0 8px var(--bad)}

  #ctrl{bottom:14px;left:14px;display:flex;flex-direction:column;gap:9px;min-width:226px}
  .btns{display:flex;gap:6px}
  button{flex:1;background:rgba(78,161,255,.10);color:var(--fg);
    border:1px solid var(--line);border-radius:7px;padding:7px 8px;cursor:pointer;
    font:inherit;font-size:12px;transition:.15s}
  button:hover{background:rgba(78,161,255,.24);border-color:var(--accent)}
  button.active{background:var(--accent);color:#04101f;border-color:var(--accent);font-weight:600}
  label{display:flex;align-items:center;gap:9px;color:var(--dim);font-size:12px}
  input[type=range]{flex:1;accent-color:var(--accent);height:3px}

  #hint{position:fixed;bottom:14px;right:14px;z-index:10;color:var(--dim);font-size:11px;
    text-align:right;line-height:1.7;opacity:.72}
  #loading{position:fixed;inset:0;display:grid;place-items:center;z-index:20;
    background:var(--bg);transition:opacity .4s}
  #loading.gone{opacity:0;pointer-events:none}
</style>
</head>
<body>

<div id="loading"><div style="text-align:center">
  <div style="color:#4ea1ff;letter-spacing:.2em;font-size:12px">MID-360 / FAST-LIO</div>
  <div style="margin-top:10px;color:#7d8da3" id="loadmsg">連線中…</div>
</div></div>

<div class="hud" id="stats">
  <h1>即時建圖</h1>
  <div class="row"><span>連線</span><span id="s-conn"><i class="dot off"></i>斷線</span></div>
  <div class="row"><span>地圖點數</span><span id="s-pts">0</span></div>
  <div class="sep"></div>
  <div class="row"><span>X</span><span id="s-x">—</span></div>
  <div class="row"><span>Y</span><span id="s-y">—</span></div>
  <div class="row"><span>Z</span><span id="s-z">—</span></div>
  <div class="row"><span>離原點</span><span id="s-range">0.00 m</span></div>
  <div class="row"><span>移動距離</span><span id="s-dist">0.00 m</span></div>
  <div class="row"><span>速度</span><span id="s-vel">0.00 m/s</span></div>
  <div class="sep"></div>
  <div class="row"><span>算繪</span><span id="s-fps">—</span></div>
</div>

<div class="hud" id="ctrl">
  <div class="btns">
    <button id="b-mode-h" class="active">高度上色</button>
    <button id="b-mode-i">強度上色</button>
  </div>
  <label>點大小 <input type="range" id="psize" min="0.01" max="0.30" step="0.01" value="0.06"></label>
  <div class="btns">
    <button id="b-follow" class="active">跟隨</button>
    <button id="b-top">俯視</button>
    <button id="b-reset">重置</button>
  </div>
  <div class="btns">
    <button id="b-traj" class="active">軌跡</button>
    <button id="b-grid" class="active">網格</button>
    <button id="b-clear">清空</button>
  </div>
</div>

<div id="hint">左鍵 旋轉 · 右鍵 平移 · 滾輪 縮放</div>

<script type="importmap">
{ "imports": { "three": "./three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './OrbitControls.js';

const MAX_POINTS = 4000000;
const STRIDE = 4;                 // x, y, z, intensity
const MOVE_EPS = 0.01;            // 小於 1cm 視為靜止抖動,不計入距離

/* ---------------- 場景 ---------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080b11);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.05, 5000);
camera.up.set(0, 0, 1);                      // ROS 慣例:Z 軸朝上
camera.position.set(-12, -12, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

const grid = new THREE.GridHelper(200, 200, 0x2f5480, 0x16243a);
grid.rotation.x = Math.PI / 2;
grid.material.transparent = true;
grid.material.opacity = 0.3;
scene.add(grid);

/* ---------------- 點雲(interleaved:直接吃伺服器的 x,y,z,i) ---------------- */
const raw = new Float32Array(MAX_POINTS * STRIDE);
const ib = new THREE.InterleavedBuffer(raw, STRIDE);
ib.setUsage(THREE.DynamicDrawUsage);

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.InterleavedBufferAttribute(ib, 3, 0));
geom.setAttribute('intensity', new THREE.InterleavedBufferAttribute(ib, 1, 3));
geom.setDrawRange(0, 0);
geom.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e6);   // 停用自動視錐裁切

const cloudMat = new THREE.ShaderMaterial({
  uniforms: {
    uSize: { value: 0.06 },         // 配合 6px 上限重新標定,見 vertexShader 註解
    uMode: { value: 0.0 },          // 0 = 高度,1 = 強度
    uZMin: { value: -1.0 }, uZMax: { value: 3.0 },
    uIMin: { value: 0.0 },  uIMax: { value: 150.0 },
  },
  vertexShader: `
    attribute float intensity;
    uniform float uSize, uMode, uZMin, uZMax, uIMin, uIMax;
    varying vec3 vColor;

    vec3 turbo(float t){
      t = clamp(t, 0.0, 1.0);
      float r = 0.13572138 + t*( 4.61539260 + t*(-42.66032258 + t*( 132.13108234 + t*(-152.94239396 + t* 59.28637943))));
      float g = 0.09140261 + t*( 2.19418839 + t*(  4.84296658 + t*(-14.18503333 + t*(   4.27729857 + t*  2.82956604))));
      float b = 0.10667330 + t*(12.64194608 + t*(-60.58204836 + t*( 110.36276771 + t*( -89.90310912 + t* 27.34824973))));
      return clamp(vec3(r, g, b), 0.0, 1.0);
    }

    void main(){
      float tz = (position.z - uZMin) / max(uZMax - uZMin, 0.001);
      float ti = (intensity  - uIMin) / max(uIMax - uIMin, 0.001);
      vColor = turbo(mix(tz, ti, uMode));

      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      // 上限原本是 14px,但 uSize*280 太大,60m 內每顆點都撞到上限,
      // 遠近一律最大顆 -> 整片糊成球,分不出物體。降到 6px 才看得出結構。
      gl_PointSize = clamp(uSize * (280.0 / -mv.z), 1.0, 6.0);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    void main(){
      vec2 d = gl_PointCoord - vec2(0.5);
      if (dot(d, d) > 0.25) discard;          // 圓形點
      gl_FragColor = vec4(vColor, 1.0);
    }
  `,
});
scene.add(new THREE.Points(geom, cloudMat));

/* ---------------- 軌跡 ---------------- */
const MAX_TRAJ = 200000;
const trajArr = new Float32Array(MAX_TRAJ * 3);
const trajAttr = new THREE.BufferAttribute(trajArr, 3);
trajAttr.setUsage(THREE.DynamicDrawUsage);
const trajGeom = new THREE.BufferGeometry();
trajGeom.setAttribute('position', trajAttr);
trajGeom.setDrawRange(0, 0);
trajGeom.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e6);
const traj = new THREE.Line(trajGeom, new THREE.LineBasicMaterial({ color: 0xffd54a }));
scene.add(traj);

/* ---------------- 光達位置標記 ---------------- */
const marker = new THREE.Group();
const ball = new THREE.Mesh(
  new THREE.SphereGeometry(0.16, 20, 14),
  new THREE.MeshBasicMaterial({ color: 0xffffff })
);
const halo = new THREE.Mesh(
  new THREE.RingGeometry(0.34, 0.44, 40),
  new THREE.MeshBasicMaterial({ color: 0x39d98a, side: THREE.DoubleSide,
                                transparent: true, opacity: 0.9 })
);
marker.add(ball, halo, new THREE.AxesHelper(1.6));
scene.add(marker);

// 從光達垂直落到地面的引導線 —— 沒有它很難判斷 3D 位置
const dropArr = new Float32Array(6);
const dropGeom = new THREE.BufferGeometry();
dropGeom.setAttribute('position', new THREE.BufferAttribute(dropArr, 3));
const drop = new THREE.Line(dropGeom, new THREE.LineDashedMaterial({
  color: 0x39d98a, dashSize: 0.18, gapSize: 0.12, transparent: true, opacity: 0.7 }));
scene.add(drop);

/* ---------------- 狀態 ---------------- */
let nPoints = 0, nTraj = 0, dist = 0;
let last = null, lastT = 0, follow = true, snapshotting = false;
// 衰減重送用:期間原地從 0 覆蓋,但 drawRange 維持舊值,收完才切換。
// 不這樣做的話,清空到填滿之間會有好幾個 frame 的空窗 —— 就是整片閃爍的成因。
let rebuilding = false, rebuildCursor = 0;
let zFloor = -1;

// 取樣供百分位數用 —— 直接用 min/max 會被離群點毀掉配色
const SAMPLE_MAX = 40000;
const zS = new Float32Array(SAMPLE_MAX), iS = new Float32Array(SAMPLE_MAX);
let nS = 0, sCursor = 0, sTick = 0;

const $ = (id) => document.getElementById(id);

/* three.js 的 updateRange / addUpdateRange 是「取代」而不是「累加」,而真正上傳
   資料是在 renderer.render() 裡才發生。所以同一個 frame 內若標記多次,
   **只有最後一次的範圍會被上傳,中間寫入的頂點永遠留在 GPU 舊值**。

   平常 odom 10Hz、一個 frame 最多一次,不會出事。但每 5 秒的衰減重送會送出
   2.4MB 分塊把 WebSocket 塞住一兩秒,之後累積的十幾筆 odom 會在同一個 JS 任務
   裡一次湧入 -> 十幾次 addTraj -> 只有最後一筆上傳 -> 軌跡線直接跨過去,
   直角就變成斜線。點雲因為每 5 秒整份重送會補回來,所以只有軌跡看得出問題。

   解法:把待上傳範圍累積起來,每個 frame 在 render 前合併成一次上傳。 */
const dirtyRanges = new Map();   // buffer -> [lo, hi](float 索引)

function markUpdated(buf, fromFloat, countFloat) {
  const d = dirtyRanges.get(buf);
  if (d) {
    if (fromFloat < d[0]) d[0] = fromFloat;
    if (fromFloat + countFloat > d[1]) d[1] = fromFloat + countFloat;
  } else {
    dirtyRanges.set(buf, [fromFloat, fromFloat + countFloat]);
  }
}

function flushUpdates() {
  if (!dirtyRanges.size) return;
  for (const [buf, r] of dirtyRanges) {
    const lo = r[0], n = r[1] - r[0];
    if (buf.addUpdateRange) {
      buf.clearUpdateRanges && buf.clearUpdateRanges();
      buf.addUpdateRange(lo, n);
    } else if (buf.updateRange) {
      buf.updateRange.offset = lo;
      buf.updateRange.count = n;
    }
    buf.needsUpdate = true;
  }
  dirtyRanges.clear();
}

function percentile(src, n, p) {
  const a = Array.prototype.slice.call(src.subarray(0, n)).sort((x, y) => x - y);
  return a[Math.min(n - 1, Math.max(0, Math.floor(n * p)))];
}

function refreshRanges() {
  if (nS < 200) return;
  const z0 = percentile(zS, nS, 0.02), z1 = percentile(zS, nS, 0.98);
  if (z1 > z0) { cloudMat.uniforms.uZMin.value = z0; cloudMat.uniforms.uZMax.value = z1; }
  zFloor = z0;
  const i0 = percentile(iS, nS, 0.02), i1 = percentile(iS, nS, 0.98);
  if (i1 > i0) { cloudMat.uniforms.uIMin.value = i0; cloudMat.uniforms.uIMax.value = i1; }
}

function addPoints(f32) {
  // 重建中就從 rebuildCursor 覆蓋舊資料,平常則接在 nPoints 之後
  const base = rebuilding ? rebuildCursor : nPoints;
  const room = MAX_POINTS - base;
  const n = Math.min(f32.length / STRIDE, room);
  if (n <= 0) return;

  raw.set(f32.subarray(0, n * STRIDE), base * STRIDE);

  // 每 13 點取樣一次,填進環狀緩衝
  for (let i = 0; i < n; i += 13) {
    const b = i * STRIDE;
    zS[sCursor] = f32[b + 2];
    iS[sCursor] = f32[b + 3];
    sCursor = (sCursor + 1) % SAMPLE_MAX;
    if (nS < SAMPLE_MAX) nS++;
  }

  markUpdated(ib, base * STRIDE, n * STRIDE);

  if (rebuilding) {
    // 只推進游標,drawRange 原封不動 —— 畫面繼續顯示舊內容,不會出現空窗
    rebuildCursor = base + n;
    return;
  }
  nPoints = base + n;
  geom.setDrawRange(0, nPoints);
  $('s-pts').textContent = nPoints.toLocaleString();
}

function addTraj(p) {
  if (nTraj >= MAX_TRAJ) return;
  trajArr[nTraj * 3] = p[0]; trajArr[nTraj * 3 + 1] = p[1]; trajArr[nTraj * 3 + 2] = p[2];
  markUpdated(trajAttr, nTraj * 3, 3);
  nTraj++;
  trajGeom.setDrawRange(0, nTraj);
}

function clearAll() {
  nPoints = 0; nTraj = 0; dist = 0; last = null; nS = 0; sCursor = 0;
  geom.setDrawRange(0, 0);
  trajGeom.setDrawRange(0, 0);
  $('s-pts').textContent = '0';
  $('s-dist').textContent = '0.00 m';
}

/* ---------------- WebSocket ---------------- */
const WS_URL = `ws://${location.hostname}:8081`;
let ws;

function connect() {
  ws = new WebSocket(WS_URL);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    $('s-conn').innerHTML = '<i class="dot on"></i>已連線';
    $('loadmsg').textContent = '載入地圖…';
  };

  ws.onmessage = (ev) => {
    if (typeof ev.data === 'string') {
      const m = JSON.parse(ev.data);
      if (m.t === 'odom') onOdom(m);
      else if (m.t === 'begin_snapshot') {
        snapshotting = true;
        $('loadmsg').textContent = `載入地圖… ${m.n.toLocaleString()} 點`;
        if (m.n === 0) finishLoading();
      } else if (m.t === 'end_snapshot') {
        snapshotting = false; refreshRanges(); finishLoading();
      } else if (m.t === 'begin_rebuild') {
        // 衰減後的重送。不清畫面,原地覆蓋。
        rebuilding = true; rebuildCursor = 0; nS = 0; sCursor = 0;
      } else if (m.t === 'end_rebuild') {
        rebuilding = false;
        nPoints = rebuildCursor;              // 這一刻才切換,所以看不到中斷
        geom.setDrawRange(0, nPoints);
        $('s-pts').textContent = nPoints.toLocaleString();
        refreshRanges();
      } else if (m.t === 'cleared') clearAll();
      return;
    }
    addPoints(new Float32Array(ev.data));
    if (!snapshotting) finishLoading();
  };

  ws.onclose = () => {
    $('s-conn').innerHTML = '<i class="dot off"></i>斷線,重連中';
    setTimeout(connect, 1500);
  };
  ws.onerror = () => ws.close();
}

function onOdom(m) {
  const p = m.p, now = performance.now();
  $('s-x').textContent = p[0].toFixed(3);
  $('s-y').textContent = p[1].toFixed(3);
  $('s-z').textContent = p[2].toFixed(3);
  $('s-range').textContent = Math.hypot(p[0], p[1], p[2]).toFixed(2) + ' m';

  if (last) {
    const step = Math.hypot(p[0] - last[0], p[1] - last[1], p[2] - last[2]);
    const dt = (now - lastT) / 1000;
    // 靜止時 FAST-LIO 的位姿會有 mm 級抖動,不設門檻的話距離會一直虛增
    if (step >= MOVE_EPS) {
      dist += step;
      $('s-dist').textContent = dist.toFixed(2) + ' m';
    }
    if (dt > 0) $('s-vel').textContent = (step / dt).toFixed(2) + ' m/s';
  }
  last = p; lastT = now;

  marker.position.set(p[0], p[1], p[2]);
  dropArr.set([p[0], p[1], p[2], p[0], p[1], zFloor]);
  dropGeom.attributes.position.needsUpdate = true;
  drop.computeLineDistances();

  addTraj(p);
  if (follow) controls.target.lerp(new THREE.Vector3(p[0], p[1], p[2]), 0.1);
}

let loaded = false;
function finishLoading() {
  if (loaded) return;
  loaded = true;
  $('loading').classList.add('gone');
}
connect();

/* ---------------- 控制項 ---------------- */
$('psize').oninput = (e) => { cloudMat.uniforms.uSize.value = parseFloat(e.target.value); };

function setMode(m) {
  cloudMat.uniforms.uMode.value = m;
  $('b-mode-h').classList.toggle('active', m === 0);
  $('b-mode-i').classList.toggle('active', m === 1);
}
$('b-mode-h').onclick = () => setMode(0);
$('b-mode-i').onclick = () => setMode(1);

$('b-follow').onclick = (e) => { follow = !follow; e.target.classList.toggle('active', follow); };
$('b-traj').onclick = (e) => { traj.visible = !traj.visible; e.target.classList.toggle('active', traj.visible); };
$('b-grid').onclick = (e) => { grid.visible = !grid.visible; e.target.classList.toggle('active', grid.visible); };

$('b-reset').onclick = () => {
  const t = last || [0, 0, 0];
  controls.target.set(t[0], t[1], t[2]);
  camera.position.set(t[0] - 12, t[1] - 12, t[2] + 8);
};
$('b-top').onclick = () => {
  const t = last || [0, 0, 0];
  controls.target.set(t[0], t[1], t[2]);
  camera.position.set(t[0], t[1] - 0.01, t[2] + 35);
};
$('b-clear').onclick = () => {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send('clear');
  clearAll();
};

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------------- 主迴圈 ---------------- */
let frames = 0, tPrev = performance.now();
function loop() {
  requestAnimationFrame(loop);

  // 讓光環永遠面向鏡頭,遠看才認得出來
  halo.quaternion.copy(camera.quaternion);
  controls.update();
  flushUpdates();          // 必須在 render 之前 —— 上傳是在 render 裡發生的
  renderer.render(scene, camera);

  frames++;
  const now = performance.now();
  if (now - tPrev >= 1000) {
    $('s-fps').textContent = Math.round((frames * 1000) / (now - tPrev)) + ' fps';
    frames = 0; tPrev = now;
    if (++sTick % 2 === 0) refreshRanges();     // 每 2 秒重算配色範圍
  }
}
loop();
</script>
</body>
</html>
