# 用既有地圖定位(不建圖)。map_server 放地圖,AMCL 算「我在哪」。
#
# ── 跟建圖模式的差別 ──────────────────────────────────────────────
#   建圖:slam_toolbox 一邊建 /map 一邊發 map -> multi_odom
#   定位:map_server 發固定的 /map,AMCL 發 map -> multi_odom
#
# ★ 兩者只能擇一。map -> multi_odom 只能有一個發布者,兩個都跑就是雙父節點
#   —— tf2 不報錯,只會在兩個答案之間隨機翻轉。start_localization.sh 會先
#   把 slam_toolbox 停掉。

map_server:
  ros__parameters:
    use_sim_time: false
    # yaml_filename 由 start_localization.sh 用 --ros-args -p 覆寫,
    # 這裡只是預設值
    yaml_filename: "/home/andykuo/maps/map_20260810_143714.yaml"
    topic_name: "map"
    frame_id: "map"

amcl:
  ros__parameters:
    use_sim_time: false

    # ── 座標系 ────────────────────────────────────────────────────
    # ★ odom_frame_id 是 multi_odom 不是 odom。我們的里程計是 EKF 融合
    #   輪速 + 光達之後發的 multi_odom -> base_footprint,底盤原本那條
    #   odom -> base_footprint 已經被關掉(publish_tf: false)。
    #   填錯的話 AMCL 會一直等一個不存在的變換,而且只會安靜地不動作。
    base_frame_id: "base_footprint"
    odom_frame_id: "multi_odom"
    global_frame_id: "map"
    scan_topic: "scan"

    # ── 粒子數 ────────────────────────────────────────────────────
    # 這台的里程計很準(光達 + 輪速融合),不需要大量粒子去補里程計的爛。
    # Orin Nano 同時還要跑 FAST-LIO,粒子開太多會排擠到它。
    # ★ 下限從 300 提高到 500。粒子散開之後(alpha 0.2)需要更多粒子
    #   才蓋得住那個範圍 —— 太少的話粒子雲會有洞,正確位置可能剛好落在洞裡。
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99

    # ── 運動模型 ──────────────────────────────────────────────────
    # ★ 2026-08-12 從 0.1 調回 0.2(Nav2 預設)。
    #
    # 我原本設 0.1,理由是「我們的里程計是光達+輪速融合,比純輪速準,
    # 所以可以更信任它」。**那個推理錯了。**
    #
    # alpha 不只代表「里程計有多準」,它決定**粒子在移動時散開多少**。
    # 而粒子濾波能自我修正,靠的就是散開:
    #
    #   alpha 小 -> 所有粒子一起平移,散布維持 0.3 m
    #               全部都在錯的位置附近,掃描比對沒有更好的選項可挑
    #               -> 車開再遠都不會修正,只是把錯誤一路帶著走
    #
    #   alpha 大 -> 粒子散成 1~2 m 的雲,有些落在比較對的地方
    #               那些權重高,重採樣後整團往正確方向靠
    #
    # 設成 0.1 等於叫它「跟著里程計走,不要質疑」—— 正好關掉了修正能力。
    # 實測症狀:位置錯 2.8 公尺,開一段路完全不修正。
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2     # 旋轉造成的旋轉誤差
    alpha2: 0.2     # 平移造成的旋轉誤差
    alpha3: 0.2     # 平移造成的平移誤差
    alpha4: 0.2     # 旋轉造成的平移誤差
    alpha5: 0.1     # 橫move(差動輪用不到)

    # ── 雷射模型 ──────────────────────────────────────────────────
    # likelihood_field 比 beam 快很多而且對地圖的小誤差比較寬容,
    # 這張圖是 08-10 建的、當時 /scan 的高度帶還是錯的,寬容一點比較好。
    laser_model_type: "likelihood_field"
    # ★ 從 2.0 提高到 6.0。likelihood field 是「每一格到最近障礙物的距離」
    #   預先算好的查表,超過這個值就**飽和** —— 離牆 2 m 和離牆 8 m 分數
    #   一模一樣,粒子感受不到「往哪邊移會變好」。
    #
    #   位置差 2.8 公尺時,大部分雷射點都落在 2 m 以外,所有候選位置分數
    #   都一樣爛,濾波器就卡在原地。改成 6.0 之後 3~6 公尺的偏差還有梯度。
    #
    #   代價:距離場的計算範圍變大(啟動時多算一點),而且對「地圖上沒有
    #   但現場有」的東西(人、臨時堆放物)比較敏感。6.0 對走廊夠用。
    laser_likelihood_max_dist: 6.0
    laser_min_range: 0.7      # 跟 start_scan.sh 的 RANGE_MIN 一致,
                              # 小於這個距離的是車體自己(輪子外緣半對角線 0.627 m)
    # ★ 30.0 不是 40.0 —— 要跟**建圖時**的上限一致,不是跟光達的射程一致。
    #   slam_params.yaml 的 max_laser_range 是 30.0,所以地圖上 30 公尺外
    #   根本沒有畫任何牆。AMCL 這裡若用 40.0,30~40 公尺的雷射點會落在
    #   地圖的空白區,一律算成「掃到地圖上不存在的東西」而降低匹配分數 ——
    #   而那些點其實是對的,只是當初沒被記錄下來。
    #
    #   換一張用不同 max_laser_range 建的地圖時,這裡要跟著改。
    laser_max_range: 30.0
    # ★ 從 120 提高到 360。/scan 有 720 束,只取 1/6 的話走廊兩側門洞的
    #   邊緣細節正好被抽掉 —— 而那些細節正是分辨「這是第幾個門洞」的
    #   唯一依據。2026-08-12 實測:AMCL 鎖到隔壁門洞,沿走廊方向差 2.8 公尺。
    #   360 束在 Orin Nano 上還負擔得起(粒子 1500 × 360 次查表)。
    max_beams: 360

    z_hit: 0.7
    z_rand: 0.3
    z_max: 0.05
    z_short: 0.05
    sigma_hit: 0.2
    lambda_short: 0.1

    # ── 更新時機 ──────────────────────────────────────────────────
    # 走 0.2 m 或轉 0.2 rad 才更新一次。太密會白吃 CPU,
    # 太疏在轉彎時會跟不上。
    update_min_d: 0.2
    update_min_a: 0.2
    resample_interval: 1
    transform_tolerance: 0.5   # map -> odom 的有效期。WiFi 抖動時放寬一點,
                               # 太小會讓 Nav2 一直抱怨 extrapolation
    # ★ 兩個都設 0 = 關閉隨機粒子注入(這是 AMCL 的預設值)。
    #
    # 開著的話(0.001 / 0.1)AMCL 會在匹配分數低時持續灌入亂數粒子,
    # 試圖從「被綁架」的狀態恢復。但代價是:匹配本來就不好的時候,
    # 它會一直注入、估計位置一直跳 —— 2026-08-12 實測就是這個症狀,
    # 車靜止不動但地圖上的位置一直游移。
    #
    # 這台車不會被人抱走,綁架偵測沒有意義。定位掉了就人工用
    # RViz 的 2D Pose Estimate 重指定,比讓它亂猜可靠。
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0

    save_pose_rate: 0.5
    tf_broadcast: true
    always_reset_initial_pose: false
    # first_map_only false:重新載入地圖時 AMCL 會跟著換
    first_map_only: false

    # 初始位置由 start_localization.sh 傳入,或在 RViz 用「2D Pose Estimate」點
    set_initial_pose: false
